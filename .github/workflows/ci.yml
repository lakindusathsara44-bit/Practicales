name: Static site checks
on:
  push:
    branches: [main, "development/**", "feature/**"]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: static-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: node --check app.js
      - name: Verify static entry files
        run: |
          test -s index.html
          test -s styles.css
          test -s app.js
          grep -q 'app.js' index.html
          grep -q 'styles.css' index.html
